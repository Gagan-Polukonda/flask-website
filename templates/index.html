{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">Welcome, {{ name }}!</h1>
                <p class="card-text">This is a Flask website with user authentication and profile management.</p>
                
                <div class="mt-4">
                    <h3>Quick Links</h3>
                    <div class="list-group">
                        <a href="https://www.linkedin.com/in/gagan-polukonda/" 
                           class="list-group-item list-group-item-action" 
                           target="_blank">
                            <i class="bi bi-linkedin"></i> LinkedIn Profile
                        </a>
                        <a href="https://www.linkedin.com/in/gagan-polukonda/overlay/1726819109357/single-media-viewer/?profileId=ACoAAC2L5XwBVrfc_M5hYqc22KEfQGBYJrE6XsA" 
                           class="list-group-item list-group-item-action" 
                           target="_blank">
                            <i class="bi bi-file-earmark-text"></i> Resume

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
